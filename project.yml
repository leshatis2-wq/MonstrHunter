name: MonsterHunt
options:
  bundleIdPrefix: com.monsterhunt.prototype
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MonsterHunt:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monsterhunt.prototype
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: AVFoundation.framework
  MonsterHuntTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MonsterHunt
schemes:
  MonsterHunt:
    build:
      targets:
        MonsterHunt: all
    test:
      targets: [MonsterHuntTests]
